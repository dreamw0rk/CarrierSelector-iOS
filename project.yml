name: CarrierSelector
options:
  bundleIdPrefix: dev.carrierselector
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '18'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The upstream XCFramework's simulator C objects require 26.5; its device slice supports 17.0.
    "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": '26.5'
targets:
  ZIPFoundation:
    type: framework.static
    platform: iOS
    sources:
      - path: vendor/ZIPFoundation/Sources/ZIPFoundation
        excludes: [Resources]
    settings:
      base:
        PRODUCT_MODULE_NAME: ZIPFoundation
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: libz.tbd
  CarrierSelector:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info*.plist"]
      - Core
      - Resources
      - path: vendor/ZIPFoundation/Sources/ZIPFoundation/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: Frameworks/swift/IDevice.xcframework
        embed: false
      - target: ZIPFoundation
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CarrierSelector
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).pairing.*"]
        UIBackgroundModes: [processing]
        NSBonjourServices: [_remotepairing-pairable-host._tcp]
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Подключение к вашему iPhone через LocalDevVPN для чтения SIM и установки операторских профилей.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.carrierselector.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: App/CarrierSelector-Bridging-Header.h
schemes:
  CarrierSelector:
    build:
      targets:
        CarrierSelector: all
