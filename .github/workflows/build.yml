name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build IPA
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Prepare toolchain
        run: |
          mkdir -p build/logs
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - name: Run tests
        run: bash tools/test.sh 2>&1 | tee build/logs/tests.log
      - name: Download verified native dependency
        run: bash tools/bootstrap.sh 2>&1 | tee build/logs/bootstrap.log
      - name: Verify pairing FFI
        run: bash tools/test-pairing-ffi.sh 2>&1 | tee build/logs/pairing.log
      - name: Build and verify unsigned IPA
        run: bash tools/build.sh 2>&1 | tee build/logs/build.log
      - name: Prepare release files
        run: |
          tag=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          python3 tools/prepare_release.py --tag "$tag"
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarrierSelector-unsigned
          path: build/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CarrierSelector-unsigned
          path: release
      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" release/*.ipa release/SHA256SUMS.txt \
            --verify-tag --title "CarrierSelector $RELEASE_TAG" --notes-file "$notes"
